name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skill
        run: python3 scripts/validate.py
      - name: Build release archive
        run: python3 scripts/package.py
      - name: Inspect archive
        run: unzip -l dist/neoforge-dev.zip
