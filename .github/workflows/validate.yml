name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skill
        run: python3 scripts/validate.py
      - name: Check bundled helper scripts
        run: |
          python3 -m py_compile minecraft-mod-dev/scripts/*.py
          python3 minecraft-mod-dev/scripts/crawl_docs.py --help >/dev/null
          python3 minecraft-mod-dev/scripts/build_doc_index.py --help >/dev/null
          python3 minecraft-mod-dev/scripts/validate_loader.py --help >/dev/null
          python3 minecraft-mod-dev/scripts/validate_structure.py --help >/dev/null
          python3 minecraft-mod-dev/scripts/validate_compatibility.py --help >/dev/null
          python3 minecraft-mod-dev/scripts/validate_dependency_graph.py --help >/dev/null
          python3 minecraft-mod-dev/scripts/generate_compatibility_report.py --help >/dev/null
          python3 minecraft-mod-dev/scripts/validate_matrix_fixtures.py
      - name: Validate compatibility example
        run: python3 minecraft-mod-dev/scripts/validate_compatibility.py minecraft-mod-dev/references/compatibility/compatibility-matrix.example.json --json
      - name: Validate compatibility dependency graph
        run: python3 minecraft-mod-dev/scripts/validate_dependency_graph.py minecraft-mod-dev/references/compatibility/compatibility-matrix.example.json --json
      - name: Validate matrix fixtures
        run: python3 minecraft-mod-dev/scripts/validate_matrix_fixtures.py
      - name: Validate loader fixture contract
        run: |
          fixture_root="$(mktemp -d)"
          for loader in neo forge clean; do
            mkdir -p "$fixture_root/$loader/src/main/java/com/example/mod" "$fixture_root/$loader/src/main/resources/META-INF"
            : > "$fixture_root/$loader/gradlew"
            : > "$fixture_root/$loader/settings.gradle"
            : > "$fixture_root/$loader/src/main/java/com/example/mod/Example.java"
          done
          printf "plugins { id 'net.neoforged.moddev' version '2.0.0' }\njava { toolchain { languageVersion = JavaLanguageVersion.of(21) } }\n" > "$fixture_root/neo/build.gradle"
          printf 'minecraft_version=1.21.1\n' > "$fixture_root/neo/gradle.properties"
          : > "$fixture_root/neo/src/main/resources/META-INF/neoforge.mods.toml"
          printf "plugins { id 'net.minecraftforge.gradle' version '6.0.25' }\njava { toolchain { languageVersion = JavaLanguageVersion.of(17) } }\n" > "$fixture_root/forge/build.gradle"
          printf 'minecraft_version=1.20.1\n' > "$fixture_root/forge/gradle.properties"
          : > "$fixture_root/forge/src/main/resources/META-INF/mods.toml"
          printf "plugins { id 'xyz.wagyourtail.unimined' version '1.4.36-kappa' }\njava { toolchain { languageVersion = JavaLanguageVersion.of(25) } }\nunimined.minecraft { version '1.12.2' }\n" > "$fixture_root/clean/build.gradle"
          printf 'mod_id=example\nroot_package=com.example\nmod_version=1.0.0\n' > "$fixture_root/clean/gradle.properties"
          : > "$fixture_root/clean/src/main/resources/mcmod.info"
          python3 minecraft-mod-dev/scripts/validate_loader.py "$fixture_root/neo" --expect-loader neoforge --expect-minecraft 1.21.1
          python3 minecraft-mod-dev/scripts/validate_loader.py "$fixture_root/forge" --expect-loader forge --expect-minecraft 1.20.1
          python3 minecraft-mod-dev/scripts/validate_loader.py "$fixture_root/clean" --expect-loader cleanroom --expect-minecraft 1.12.2
          python3 minecraft-mod-dev/scripts/validate_structure.py "$fixture_root/neo" --loader neoforge
          python3 minecraft-mod-dev/scripts/validate_structure.py "$fixture_root/forge" --loader forge
          python3 minecraft-mod-dev/scripts/validate_structure.py "$fixture_root/clean" --loader cleanroom
          mkdir -p "$fixture_root/forge1122/src/main/java/com/example/mod" "$fixture_root/forge1122/src/main/resources/META-INF"
          : > "$fixture_root/forge1122/gradlew"
          : > "$fixture_root/forge1122/settings.gradle"
          printf "plugins { id 'net.minecraftforge.gradle' version '6.0.25' }\njava { toolchain { languageVersion = JavaLanguageVersion.of(8) } }\n" > "$fixture_root/forge1122/build.gradle"
          printf 'minecraft_version=1.12.2\n' > "$fixture_root/forge1122/gradle.properties"
          : > "$fixture_root/forge1122/src/main/resources/META-INF/mods.toml"
          if python3 minecraft-mod-dev/scripts/validate_loader.py "$fixture_root/forge1122" --expect-loader forge --expect-minecraft 1.12.2; then
            echo 'Forge 1.12.2 must remain outside the supported matrix' >&2
            exit 1
          fi
      - name: Generate compatibility report
        run: python3 minecraft-mod-dev/scripts/generate_compatibility_report.py minecraft-mod-dev/references/compatibility/compatibility-matrix.example.json --output /tmp/compatibility-report.md
      - name: Build release archive
        run: python3 scripts/package.py
      - name: Inspect archive
        run: unzip -l dist/minecraft-mod-dev.zip
