name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skill
        run: python3 scripts/validate.py
      - name: Check bundled helper scripts
        run: |
          python3 -m py_compile neoforge-dev/scripts/*.py
          python3 neoforge-dev/scripts/crawl_docs.py --help >/dev/null
          python3 neoforge-dev/scripts/build_doc_index.py --help >/dev/null
          python3 neoforge-dev/scripts/validate_loader.py --help >/dev/null
          python3 neoforge-dev/scripts/validate_structure.py --help >/dev/null
          python3 neoforge-dev/scripts/validate_compatibility.py --help >/dev/null
      - name: Validate compatibility example
        run: python3 neoforge-dev/scripts/validate_compatibility.py neoforge-dev/references/compatibility/compatibility-matrix.example.json --json
      - name: Build release archive
        run: python3 scripts/package.py
      - name: Inspect archive
        run: unzip -l dist/neoforge-dev.zip
